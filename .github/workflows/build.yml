name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_VERSION: "0.1.11"
  QT_VERSION: "6.8.3"

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2t64 || \
            sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtsvg
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j"$(nproc)"
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/vectora AppDir/usr/bin/
          cp packaging/vectora.desktop AppDir/usr/share/applications/
          cp resources/vectora.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file packaging/vectora.desktop \
            --icon-file resources/vectora.svg --output appimage
          mv Vectora*.AppImage "Vectora-${APP_VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Vectora-${{ env.APP_VERSION }}-x86_64.AppImage
          if-no-files-found: error

  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libqt6svg6-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
      - name: Build DEB package
        run: |
          cd build
          cpack -G DEB
          mv vectora-*.deb "../Vectora-${APP_VERSION}-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: Vectora-${{ env.APP_VERSION }}-amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtsvg
          cache: true
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release
      - name: Deploy Qt and build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\vectora.exe dist\vectora.exe
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime `
            --no-translations --dir dist dist\vectora.exe
          choco install nsis --no-progress -y
          $env:Path += ";C:\Program Files (x86)\NSIS"
          makensis /DVERSION=$env:APP_VERSION /DDIST="$($pwd.Path)\dist" packaging\vectora.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Vectora-${{ env.APP_VERSION }}-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtsvg
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Add application icon and build DMG
        run: |
          APP="$(find build -maxdepth 2 -name '*.app' -type d | head -1)"
          mkdir -p Vectora.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" resources/vectora-1024.png \
              --out "Vectora.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" resources/vectora-1024.png \
              --out "Vectora.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Vectora.iconset -o vectora.icns
          cp vectora.icns "$APP/Contents/Resources/vectora.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile vectora" \
            "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string vectora" \
              "$APP/Contents/Info.plist"
          macdeployqt "$APP" -dmg
          DMG="$(find build -maxdepth 2 -name '*.dmg' | head -1)"
          mv "$DMG" "Vectora-${APP_VERSION}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Vectora-${{ env.APP_VERSION }}-macOS.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [linux-appimage, linux-deb, windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vectora ${{ env.APP_VERSION }}
          make_latest: true
          files: artifacts/*
          body: |
            **Vectora ${{ env.APP_VERSION }}** — кроссплатформенный векторный редактор.

            - **Windows:** `Vectora-${{ env.APP_VERSION }}-Setup.exe` (установщик)
            - **Linux:** `Vectora-${{ env.APP_VERSION }}-x86_64.AppImage` (портативный) и `Vectora-${{ env.APP_VERSION }}-amd64.deb`
            - **macOS:** `Vectora-${{ env.APP_VERSION }}-macOS.dmg`

            Сборки не подписаны: Windows SmartScreen и macOS Gatekeeper могут показать предупреждение.
            Для macOS: правый клик → «Открыть» или `xattr -dr com.apple.quarantine /Applications/Vectora.app`.
            Для AppImage: `chmod +x Vectora-*.AppImage` и запустить.
